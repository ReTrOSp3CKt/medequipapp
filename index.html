<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MedEquip QR | Паспорт медицинского оборудования</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #e9f0f3; min-height: 100vh; padding: 28px 20px; }
        .med-container { max-width: 1400px; margin: 0 auto; background: #ffffff; border-radius: 2rem; box-shadow: 0 20px 35px -12px rgba(1,55,74,0.2); overflow: hidden; }
        .med-header { background: linear-gradient(105deg, #0f4c5f 0%, #166d7c 100%); padding: 28px 34px; color: white; }
        .med-header h1 { font-weight: 700; font-size: 1.9rem; display: flex; align-items: center; gap: 14px; }
        .med-header h1::before { content: "🏥"; font-size: 2rem; }
        .med-sub { color: #d4f0f7; margin-top: 8px; font-size: 0.95rem; }
        .sync-status { margin-top: 10px; font-size: 0.8rem; display: flex; align-items: center; gap: 8px; }
        .sync-status.online { color: #a5f0c2; }
        .sync-status.offline { color: #ffb8b8; }
        .med-tabs { display: flex; background: #f5fafc; padding: 0 30px; gap: 8px; border-bottom: 1px solid #cde2ea; flex-wrap: wrap; }
        .tab-btn { background: transparent; border: none; font-weight: 600; font-size: 1rem; padding: 16px 24px; cursor: pointer; color: #226b7c; border-radius: 28px 28px 0 0; display: flex; align-items: center; gap: 8px; }
        .tab-btn.active { background: white; color: #0c6d80; border-bottom: 3px solid #0c6d80; }
        .tab-pane { display: none; padding: 32px 34px; animation: fadeIn 0.25s ease; }
        .tab-pane.active-pane { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px);} to { opacity: 1; transform: translateY(0);} }
        .search-bar { margin-bottom: 28px; display: flex; gap: 12px; flex-wrap: wrap; }
        .search-input { flex: 1; padding: 14px 20px; border-radius: 50px; border: 1.5px solid #d4e3ea; font-size: 1rem; }
        .search-info { background: #e8f4f7; border-radius: 16px; padding: 12px 16px; margin-bottom: 20px; text-align: center; font-size: 0.9rem; color: #0f6b7c; }
        .results-count { background: #ecf8fb; padding: 8px 16px; border-radius: 40px; font-size: 0.85rem; color: #0f5366; }
        .equip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 28px; }
        .equip-card { background: #ffffff; border-radius: 28px; box-shadow: 0 10px 20px rgba(0,40,50,0.05); border: 1px solid #e2f0f5; transition: all 0.25s; overflow: hidden; cursor: pointer; }
        .equip-card:hover { transform: translateY(-5px); box-shadow: 0 22px 32px -12px rgba(8,78,92,0.2); }
        .card-header-med { background: #ecf8fb; padding: 18px 20px; border-bottom: 1px solid #d5eaf0; }
        .card-header-med h3 { font-size: 1.35rem; color: #0f5366; font-weight: 700; }
        .badge-department { background: #bef0fb; color: #0c6a7c; padding: 4px 12px; border-radius: 40px; font-size: 0.7rem; font-weight: 600; display: inline-block; margin-top: 8px; }
        .card-body-med { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
        .info-row { display: flex; justify-content: space-between; border-bottom: 1px dashed #e5f0f4; padding: 6px 0; font-size: 0.9rem; }
        .info-label { font-weight: 700; color: #2b7c90; }
        .qr-box { display: flex; justify-content: center; align-items: center; background: #fefefe; margin: 12px 0 8px; padding: 12px; border-radius: 24px; border: 1px solid #ddecF2; min-height: 150px; }
        .delete-equip { background: #fee9e9; border: none; color: #bc5a5a; padding: 8px 12px; border-radius: 40px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 12px; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        .modal-content { background-color: #fff; margin: 5% auto; padding: 0; border-radius: 32px; width: 90%; max-width: 550px; max-height: 85vh; overflow-y: auto; }
        .modal-header { background: linear-gradient(105deg, #0f4c5f 0%, #166d7c 100%); color: white; padding: 20px 24px; border-radius: 32px 32px 0 0; display: flex; justify-content: space-between; align-items: center; }
        .close-modal { background: rgba(255,255,255,0.2); border: none; color: white; font-size: 28px; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; }
        .modal-body { padding: 24px; }
        .modal-detail-row { padding: 12px 0; border-bottom: 1px solid #e0eef3; }
        .modal-detail-label { font-weight: 700; color: #1c6a7c; display: block; margin-bottom: 6px; font-size: 0.85rem; text-transform: uppercase; }
        .modal-detail-value { color: #2c3e50; font-size: 1rem; line-height: 1.4; }
        .qr-code-in-modal { text-align: center; margin: 20px 0; padding: 15px; background: #f5fafc; border-radius: 20px; }
        .form-card-modern { background: #fefeff; border-radius: 32px; border: 1px solid #cde2ea; padding: 28px 32px; max-width: 700px; margin: 0 auto; }
        .form-group { margin-bottom: 22px; }
        label { font-weight: 600; color: #1c6a7c; margin-bottom: 8px; display: block; font-size: 0.9rem; }
        input, textarea { width: 100%; padding: 12px 16px; border-radius: 20px; border: 1.5px solid #d4e3ea; background: white; font-size: 0.95rem; }
        .btn-primary { background: #1a7e91; color: white; border: none; width: 100%; padding: 14px 20px; border-radius: 50px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .empty-state { text-align: center; background: #f4fbfe; padding: 45px 20px; border-radius: 36px; color: #568b9b; }
        footer { text-align: center; padding: 18px; font-size: 0.75rem; color: #7f9ea8; background: #fbfefe; border-top: 1px solid #deeef3; }
        @media (max-width: 680px) { .med-tabs { padding: 0 12px; } .tab-pane { padding: 20px; } .equip-grid { gap: 18px; } }
    </style>
</head>
<body>

<div class="med-container">
    <div class="med-header">
        <h1>MedEquip QR-паспорт</h1>
        <div class="med-sub">Генерация QR-кодов · учёт медицинской техники</div>
        <div class="sync-status" id="syncStatus">🔄 Подключение...</div>
    </div>

    <div class="med-tabs">
        <button class="tab-btn active" data-tabname="view">📋 Оборудование</button>
        <button class="tab-btn" data-tabname="add">✚ Добавить</button>
    </div>

    <div id="viewTab" class="tab-pane active-pane">
        <div class="search-info">📱 Отсканируйте QR-код — откроется карточка оборудования</div>
        <div class="search-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск...">
            <div id="resultsCount" class="results-count">Всего: 0</div>
        </div>
        <div id="equipmentListGrid" class="equip-grid"></div>
    </div>

    <div id="addTab" class="tab-pane">
        <div class="form-card-modern">
            <h3 style="color:#165e6e;">📝 Регистрация оборудования</h3>
            <form id="createEquipmentForm">
                <div class="form-group">
                    <label>📋 Наименование *</label>
                    <input type="text" id="eqName" required>
                </div>
                <div class="form-group">
                    <label>👤 Отделение</label>
                    <input type="text" id="eqDepartment">
                </div>
                <div class="form-group">
                    <label>🔢 Серийный номер</label>
                    <input type="text" id="eqSerial">
                </div>
                <div class="form-group">
                    <label>📅 Дата установки</label>
                    <input type="date" id="eqInstallDate">
                </div>
                <div class="form-group">
                    <label>📅 Последний техосмотр</label>
                    <input type="date" id="eqLastInspection">
                </div>
                <div class="form-group">
                    <label>📅 Следующий техосмотр</label>
                    <input type="date" id="eqNextInspection">
                </div>
                <div class="form-group">
                    <label>📖 Руководство</label>
                    <textarea id="eqManual" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>📝 Заметки</label>
                    <textarea id="eqNotes" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-primary" id="submitBtn">✨ Сохранить и создать QR</button>
            </form>
        </div>
    </div>
    <footer>MedEquip QR — облачная синхронизация</footer>
</div>

<div id="equipmentModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>📄 Карточка оборудования</h2>
            <button class="close-modal">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script>
// ============================================
// ПОДКЛЮЧЕНИЕ К SUPABASE
// ============================================
const SUPABASE_URL = 'https://rbdenrzeikucusoeyjga.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJiZGVucnplaWt1Y3Vzb2V5amdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NzYzNjUsImV4cCI6MjA5NDI1MjM2NX0.ISgVQGMZYGIVkygS4ABFL_VQ0KiIZwXfOed6hg5yPho';

const BASE_URL = window.location.href.split('?')[0].split('#')[0];
let currentDevices = [];

// Универсальная функция запроса
async function supabaseFetch(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            ...options.headers
        }
    });
    
    if (!response.ok) {
        const error = await response.text();
        throw new Error(`HTTP ${response.status}`);
    }
    
    if (response.status === 204) return null;
    return await response.json();
}

// Загрузка всех записей
async function fetchAllEquipment() {
    try {
        const url = `${SUPABASE_URL}/rest/v1/equipment?select=*&order=createdAt.desc`;
        const data = await supabaseFetch(url);
        currentDevices = data || [];
        updateSyncStatus(true);
        localStorage.setItem('medequip_backup', JSON.stringify(currentDevices));
        return currentDevices;
    } catch (error) {
        console.error('Fetch error:', error);
        updateSyncStatus(false);
        const backup = localStorage.getItem('medequip_backup');
        if (backup) {
            currentDevices = JSON.parse(backup);
            return currentDevices;
        }
        return [];
    }
}

// Добавление записи
async function addEquipmentToDB(device) {
    try {
        const url = `${SUPABASE_URL}/rest/v1/equipment`;
        console.log('Отправляем:', device); // Для отладки
        await supabaseFetch(url, {
            method: 'POST',
            body: JSON.stringify(device)
        });
        currentDevices = [device, ...currentDevices];
        localStorage.setItem('medequip_backup', JSON.stringify(currentDevices));
        updateSyncStatus(true);
        return device;
    } catch (error) {
        console.error('Add error:', error);
        updateSyncStatus(false);
        device.offlineMode = true;
        currentDevices = [device, ...currentDevices];
        localStorage.setItem('medequip_backup', JSON.stringify(currentDevices));
        throw new Error('Сохранено локально (нет связи с сервером)');
    }
}

// Удаление записи
async function deleteEquipmentFromDB(id) {
    try {
        const url = `${SUPABASE_URL}/rest/v1/equipment?id=eq.${id}`;
        await supabaseFetch(url, { method: 'DELETE' });
        currentDevices = currentDevices.filter(d => d.id != id);
        localStorage.setItem('medequip_backup', JSON.stringify(currentDevices));
        updateSyncStatus(true);
        return true;
    } catch (error) {
        console.error('Delete error:', error);
        updateSyncStatus(false);
        currentDevices = currentDevices.filter(d => d.id != id);
        localStorage.setItem('medequip_backup', JSON.stringify(currentDevices));
        throw new Error('Удалено локально');
    }
}

function updateSyncStatus(online) {
    const statusDiv = document.getElementById('syncStatus');
    if (online) {
        statusDiv.innerHTML = '✅ База данных подключена · синхронизация работает';
        statusDiv.className = 'sync-status online';
    } else {
        statusDiv.innerHTML = '⚠️ Оффлайн-режим · данные локально';
        statusDiv.className = 'sync-status offline';
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function generateId() {
    return Date.now() + '-' + Math.random().toString(36).substr(2, 8);
}

function generateQRCode(containerId, equipmentId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    const cardUrl = BASE_URL + '?card=' + encodeURIComponent(equipmentId);
    new QRCode(container, {
        text: cardUrl,
        width: 130,
        height: 130,
        colorDark: "#135f70",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
    });
}

function openEquipmentCard(equipmentId) {
    const device = currentDevices.find(d => d.id == equipmentId);
    if (!device) {
        alert('Оборудование не найдено');
        return;
    }
    
    const modal = document.getElementById('equipmentModal');
    const modalBody = document.getElementById('modalBody');
    
    modalBody.innerHTML = `
        <div class="modal-detail-row"><div class="modal-detail-label">📋 Наименование</div><div class="modal-detail-value"><strong>${escapeHtml(device.name)}</strong></div></div>
        <div class="modal-detail-row"><div class="modal-detail-label">👤 Отделение</div><div class="modal-detail-value">${escapeHtml(device.department || '—')}</div></div>
        <div class="modal-detail-row"><div class="modal-detail-label">🔢 Серийный номер</div><div class="modal-detail-value">${escapeHtml(device.serialNumber || '—')}</div></div>
        <div class="modal-detail-row"><div class="modal-detail-label">📅 Дата установки</div><div class="modal-detail-value">${escapeHtml(device.installDate || '—')}</div></div>
        <div class="modal-detail-row"><div class="modal-detail-label">📅 Последний техосмотр</div><div class="modal-detail-value">${escapeHtml(device.lastInspection || '—')}</div></div>
        <div class="modal-detail-row"><div class="modal-detail-label">📅 Следующий техосмотр</div><div class="modal-detail-value">${escapeHtml(device.nextInspection || '—')}</div></div>
        <div class="modal-detail-row"><div class="modal-detail-label">📖 Руководство</div><div class="modal-detail-value">${escapeHtml(device.manual || '—')}</div></div>
        <div class="modal-detail-row"><div class="modal-detail-label">📝 Заметки</div><div class="modal-detail-value">${escapeHtml(device.notes || '—')}</div></div>
        <div class="qr-code-in-modal"><div id="modalQRContainer"></div></div>
    `;
    
    modal.style.display = 'block';
    
    setTimeout(() => {
        const modalQR = document.getElementById('modalQRContainer');
        if (modalQR) {
            modalQR.innerHTML = '';
            new QRCode(modalQR, {
                text: BASE_URL + '?card=' + encodeURIComponent(equipmentId),
                width: 120,
                height: 120,
                colorDark: "#135f70",
                colorLight: "#ffffff"
            });
        }
    }, 100);
}

async function renderEquipmentGrid() {
    const container = document.getElementById("equipmentListGrid");
    const searchInput = document.getElementById('searchInput');
    const searchTerm = searchInput ? searchInput.value : '';
    
    container.innerHTML = '<div class="empty-state">🔄 Загрузка...</div>';
    
    const devices = await fetchAllEquipment();
    const filteredDevices = devices.filter(d => {
        if (!searchTerm.trim()) return true;
        const term = searchTerm.toLowerCase();
        return (d.name && d.name.toLowerCase().includes(term)) ||
               (d.department && d.department.toLowerCase().includes(term)) ||
               (d.serialNumber && d.serialNumber.toLowerCase().includes(term));
    });
    
    const countSpan = document.getElementById('resultsCount');
    if (countSpan) countSpan.textContent = `Найдено: ${filteredDevices.length} из ${devices.length}`;
    
    if (!filteredDevices.length) {
        container.innerHTML = '<div class="empty-state">🏥 Оборудование не найдено.<br>📌 Добавьте первую единицу техники.</div>';
        return;
    }
    
    container.innerHTML = '';
    
    filteredDevices.forEach((device, idx) => {
        const qrId = 'qr_' + device.id + '_' + idx;
        const card = document.createElement('div');
        card.className = 'equip-card';
        card.onclick = (e) => { if (!e.target.classList.contains('delete-equip')) openEquipmentCard(device.id); };
        card.innerHTML = `
            <div class="card-header-med">
                <h3>${escapeHtml(device.name)}</h3>
                <span class="badge-department">${escapeHtml(device.department ? device.department.split(',')[0] : 'Без отделения')}</span>
            </div>
            <div class="card-body-med">
                <div class="info-row"><span class="info-label">Серийный номер:</span> ${escapeHtml(device.serialNumber || '—')}</div>
                <div class="info-row"><span class="info-label">Следующий осмотр:</span> ${escapeHtml(device.nextInspection || '—')}</div>
                <div class="qr-box" id="${qrId}"></div>
                <button class="delete-equip" data-id="${device.id}">🗑 Удалить</button>
            </div>
        `;
        container.appendChild(card);
        setTimeout(() => generateQRCode(qrId, device.id), 50);
    });
    
    document.querySelectorAll('.delete-equip').forEach(btn => {
        btn.onclick = async (e) => {
            e.stopPropagation();
            const id = btn.getAttribute('data-id');
            if (confirm('Удалить оборудование?')) {
                btn.disabled = true;
                btn.textContent = '⌛ Удаление...';
                try {
                    await deleteEquipmentFromDB(id);
                    await renderEquipmentGrid();
                    alert('Оборудование удалено');
                } catch (err) {
                    alert(err.message);
                    btn.disabled = false;
                    btn.textContent = '🗑 Удалить';
                }
            }
        };
    });
}

async function addMedicalEquipment(event) {
    event.preventDefault();
    
    const nameValue = document.getElementById('eqName').value.trim();
    if (!nameValue) {
        alert("Введите наименование оборудования");
        return;
    }
    
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ Сохранение...';
    
   const newDevice = {
    id: generateId(),
    name: nameValue,
    department: document.getElementById('eqDepartment').value.trim() || "—",
    serialnumber: document.getElementById('eqSerial').value.trim() || "—",     // ← маленькими
    installdate: document.getElementById('eqInstallDate').value || "—",       // ← маленькими
    lastinspection: document.getElementById('eqLastInspection').value || "—", // ← маленькими
    nextinspection: document.getElementById('eqNextInspection').value || "—", // ← маленькими
    manual: document.getElementById('eqManual').value.trim() || "—",
    notes: document.getElementById('eqNotes').value.trim() || "—",
    createdAt: new Date().toLocaleString('ru-RU')  // ← с большой C и большой A
};
    
    try {
        await addEquipmentToDB(newDevice);
        document.getElementById('createEquipmentForm').reset();
        switchToTab('view');
        await renderEquipmentGrid();
        alert(`✅ Оборудование "${nameValue}" добавлено!`);
    } catch (error) {
        alert(error.message);
        if (error.message.includes('локально')) {
            switchToTab('view');
            await renderEquipmentGrid();
        }
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '✨ Сохранить и создать QR';
    }
}

function switchToTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => {
        const name = btn.getAttribute('data-tabname');
        if (name === tabId) btn.classList.add('active');
        else btn.classList.remove('active');
    });
    
    const view = document.getElementById('viewTab');
    const add = document.getElementById('addTab');
    
    if (tabId === 'view') {
        view.classList.add('active-pane');
        add.classList.remove('active-pane');
        renderEquipmentGrid();
    } else {
        add.classList.add('active-pane');
        view.classList.remove('active-pane');
    }
}

function checkUrlForCard() {
    const params = new URLSearchParams(window.location.search);
    const cardId = params.get('card');
    if (cardId) {
        setTimeout(async () => {
            await fetchAllEquipment();
            openEquipmentCard(cardId);
            history.pushState({}, '', window.location.pathname);
        }, 500);
    }
}

let searchTimeout;
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => switchToTab(btn.getAttribute('data-tabname'));
    });
    
    document.getElementById('createEquipmentForm').onsubmit = addMedicalEquipment;
    
    const modal = document.getElementById('equipmentModal');
    document.querySelector('.close-modal').onclick = () => modal.style.display = 'none';
    window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
    
    const search = document.getElementById('searchInput');
    if (search) {
        search.oninput = () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => renderEquipmentGrid(), 300);
        };
    }
    
    renderEquipmentGrid();
    checkUrlForCard();
});
</script>
</body>
</html>
